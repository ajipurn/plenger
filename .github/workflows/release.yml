name: Release
# A pushed v* tag stages that version on npm through trusted publishing: npm
# trusts this workflow by name, so no token is stored, and the version carries
# provenance. The trusted publisher may only stage, so a maintainer approves the
# staged version with 2FA on npmjs.com (Staged Packages) or with
# `npm stage approve <stage-id>`. A manual run checks and packs the same way,
# then dry-runs a prerelease of the current version, since npm refuses even a dry
# run of a version it already has.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      # Staged trusted publishing needs npm 11.15.0 or later; Node.js 22 ships npm 10.
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check that the tag names the package version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm test:package
      - name: Stage
        if: github.event_name == 'push'
        run: npm stage publish --provenance
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dry.$GITHUB_RUN_ID"
          npm stage publish --dry-run --tag dry-run
