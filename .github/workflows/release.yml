name: Release
# A pushed v* tag publishes that version to npm through trusted publishing: npm
# trusts this workflow by name, so no token is stored, and it adds provenance.
# A manual run checks and packs the same way, then stops at a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 ships npm 10.
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check that the tag names the package version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm test:package
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run
