name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm build
      - run: pnpm dashboard:build
      - run: node scripts/github-action.ts
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PLENGER_PATH: src
          PLENGER_SARIF_FILE: plenger.sarif
          PLENGER_FAIL_ON: high
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: plenger
        with:
          path: src
      - name: Check action output
        env:
          PLENGER_SARIF_FILE: ${{ steps.plenger.outputs.sarif-file }}
        run: test -s "$PLENGER_SARIF_FILE"
