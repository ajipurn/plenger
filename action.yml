name: plenger
description: Static triage for Python, JavaScript and TypeScript agentic AI projects
inputs:
  path:
    description: File or directory to scan, relative to the workspace
    default: .
  fail-on:
    description: Fail for new unsuppressed findings at or above critical, high, medium or low; none disables the gate
    default: high
  baseline:
    description: Optional version 1 baseline file, relative to the workspace
    default: ''
  suppressions:
    description: Optional version 1 suppressions file, relative to the workspace
    default: ''
  sarif-file:
    description: SARIF output file inside the workspace
    default: plenger.sarif
  gitignore:
    description: Respect the scanned project's .gitignore files
    default: 'true'
  source-root:
    description: Repository root inside the workspace; SARIF paths are relative to it, as code scanning expects
    default: .
  include-suppressed:
    description: Keep suppressed findings in the SARIF file. GitHub does not honour SARIF suppressions and would show them as open alerts
    default: 'false'
  ai-review:
    description: Also run one bounded AI source review and add its findings to the SARIF file. Sends redacted source to ai-provider
    default: 'false'
  ai-provider:
    description: Model provider for the AI review, anthropic, openai, gemini or ollama
    default: anthropic
  ai-model:
    description: Model id for the AI review
    default: ''
  ai-api-key:
    description: API key for ai-provider; pass it from a repository secret
    default: ''
  ai-base-url:
    description: Optional API base URL for ai-provider
    default: ''
  ai-token-limit:
    description: Token limit for the AI review, required when ai-review is true
    default: ''
  ai-mode:
    description: AI review mode, batch or explore
    default: batch
outputs:
  sarif-file:
    description: Workspace-relative SARIF output path, also produced when the finding gate fails
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: Scanner exit code (0 success, 1 scan, I/O or AI review error, 2 invalid input, 3 finding gate failure)
    value: ${{ steps.scan.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.23.4'
        package-manager-cache: false
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 10.19.0
        run_install: false
    - name: Install scanner dependencies
      shell: bash
      run: pnpm --dir "$GITHUB_ACTION_PATH" install --prod --frozen-lockfile --ignore-scripts
    - name: Scan
      id: scan
      shell: bash
      env:
        PLENGER_PATH: ${{ inputs.path }}
        PLENGER_FAIL_ON: ${{ inputs.fail-on }}
        PLENGER_BASELINE: ${{ inputs.baseline }}
        PLENGER_SUPPRESSIONS: ${{ inputs.suppressions }}
        PLENGER_SARIF_FILE: ${{ inputs.sarif-file }}
        PLENGER_GITIGNORE: ${{ inputs.gitignore }}
        PLENGER_SOURCE_ROOT: ${{ inputs.source-root }}
        PLENGER_INCLUDE_SUPPRESSED: ${{ inputs.include-suppressed }}
        PLENGER_AI_REVIEW: ${{ inputs.ai-review }}
        PLENGER_AI_PROVIDER: ${{ inputs.ai-provider }}
        PLENGER_AI_MODEL: ${{ inputs.ai-model }}
        PLENGER_AI_API_KEY: ${{ inputs.ai-api-key }}
        PLENGER_AI_BASE_URL: ${{ inputs.ai-base-url }}
        PLENGER_AI_TOKEN_LIMIT: ${{ inputs.ai-token-limit }}
        PLENGER_AI_MODE: ${{ inputs.ai-mode }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.ts"
branding:
  icon: shield
  color: purple
